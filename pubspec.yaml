name: app_leitura
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  # G12: o ícone esmaecido/tingido vai pelo caminho rasterizado (sem a camada `saveLayer` do caminho por picture).
  vector_graphics: ^1.2.3
  go_router: ^18.0.1
  # G03 (ADR-002): SQLite do SDK PowerSync + drift como dono do esquema local.
  drift: ^2.35.1
  drift_sqlite_async: ^0.3.1
  powersync: ^2.4.0
  # G05 (conta e login — D-64…D-69): Supabase Auth com sessão no armazenamento seguro do sistema,
  # Google/Apple nativos (credenciais reais quando houver projeto na nuvem — D-67), sinal de idade
  # das lojas (D-66), arquivo de exportação (D-65).
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  age_range_signals: ^0.10.0
  http: ^1.6.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite_async: ^0.14.5
  connectivity_plus: ^7.3.2
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  archive: 4.3.0
  xml: 7.0.1
  unorm_dart: 0.3.3
  pdfrx: 2.6.5
  wakelock_plus: 1.8.1
  file_picker: 13.1.0
  pdfium_dart: 0.3.1
  ffi: 2.2.0
  # G22 (Anexo 04, D-228…D-232): a compra do Pro pelo RevenueCat (a versão do Anexo 04) e a página de
  # gestão da assinatura na loja (R6). O url_launcher já vinha pelo supabase_flutter: a mesma versão.
  purchases_flutter: 10.14.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # G20 (R9): o teste de aparelho dos orçamentos do Anexo 03 §12 (só desenvolvimento — ADR-005)
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Ícones SVG oficiais do arquivo (design_handoff/assets/icons), os do leitor (telas 19–27b, G01.8) e
  # licença OFL das fontes.
  assets:
    - assets/icons/
    - assets/icons/leitor/
    - assets/icons/leitor_extra/
    # G16: os objetos da prateleira do modo anotação (tela 22), exportados na G01.8.
    - assets/illustrations/leitor/
    # T02 (D-242): os ícones e as capas da Início nova e da revisão (telas 01, 01b, 60–63), exportados na T02.
    - assets/icons/inicio2/
    - assets/illustrations/inicio2/
    # T13.11 (R7, D-284): os SVGs novos das telas das etapas 7–11, na pasta da área da 1ª etapa que os usa.
    - assets/icons/biblioteca/
    - assets/icons/scanner/
    - assets/icons/entrada/
    - assets/icons/perfil/
    - assets/icons/cronometro/
    - assets/illustrations/biblioteca/
    - assets/illustrations/scanner/
    - assets/illustrations/entrada/
    - assets/illustrations/perfil/
    - assets/illustrations/cronometro/
    - assets/fonts/LICENCAS_FONTES_OFL.txt

