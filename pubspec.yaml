    # G10 (D-17/ADR-004): Literata VARIÁVEL (opsz + wght) para o texto do livro, normal e itálica, com os
    # subconjuntos como fallback na ordem do unicode-range. O estilo é montado só em ReaderTypography
    # (opsz = tamanho e wght sempre explícitos; fontWeight fica 400 para não haver negrito sintético).
    - family: LiterataVF
      fonts:
        - asset: assets/fonts/Literata-VF.ttf
        - asset: assets/fonts/LiterataItalic-VF.ttf
          style: italic
    - family: LiterataVFExt
      fonts:
        - asset: assets/fonts/Literata-VFExt.ttf
        - asset: assets/fonts/LiterataItalic-VFExt.ttf
          style: italic
    - family: LiterataVFVi
      fonts:
