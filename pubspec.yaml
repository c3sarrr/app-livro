        - asset: assets/fonts/Literata-VFCyrExt.ttf
        - asset: assets/fonts/LiterataItalic-VFCyrExt.ttf
          style: italic
    - family: LiterataVFGr
      fonts:
        - asset: assets/fonts/Literata-VFGr.ttf
        - asset: assets/fonts/LiterataItalic-VFGr.ttf
          style: italic
    - family: LiterataVFGrExt
