<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adicionar livro à mão — BookNest</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700;800&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>

a{color:#1A1714;text-decoration:none}a:hover{color:#1A1714}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>

<div lang="pt-BR" style="position: relative; width: 390px; height: 1150px; overflow: hidden; background: #F7F0E3;">

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; height: 48px; display: flex; align-items: center; justify-content: space-between;">
    <a href="#" aria-label="Fechar sem salvar" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFAF1; border: 1.5px solid #1A1714; box-shadow: 2px 2px 0 #1A1714; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFAF1; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; font-size: 12px; font-weight: 800; white-space: nowrap;">Livro fora da base</span>
  </div>

  <main style="position: absolute; left: 0; right: 0; top: 122px; padding: 0 16px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 0.98; letter-spacing: -1px;">Adicionar<br><span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 42px; letter-spacing: -0.4px;">à mão.</span></h1>

    <!-- cover: generated from the title until a photo is added -->
    <div style="margin-top: 20px; display: flex; gap: 16px; align-items: flex-start;">
      <div style="position: relative; flex-shrink: 0;">
        <span role="img" aria-label="Capa criada automaticamente: Receitas da vó Cida" style="position: relative; display: block; width: 124px; height: 180px; border-radius: 6px 14px 14px 6px; background: #FFC1C6; border: 1.5px solid #1A1714; box-shadow: 4px 4px 0 #1A1714; box-sizing: border-box; overflow: hidden; transform: rotate(-3deg);">
          <span style="position: absolute; left: 8px; top: 0; bottom: 0; width: 1.5px; background: rgba(26,23,20,0.35);"></span>
          <svg width="122" height="90" viewBox="0 0 122 90" style="position: absolute; left: 0; top: 8px;">
            <path d="M36 52h50l-5 22H41z" fill="#FFFAF1" stroke="#1A1714" stroke-width="1.5" stroke-linejoin="round"></path>
            <path d="M32 52h58" stroke="#1A1714" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M50 44q-4-8 0-14t0-14M61 44q-4-8 0-14t0-14M72 44q-4-8 0-14t0-14" fill="none" stroke="#1A1714" stroke-width="1.6" stroke-linecap="round"></path>
            <g transform="translate(88 10) scale(.8)"><path d="M12 1.5C12.4 7.2 13.6 10.9 22.5 12 13.6 13.1 12.4 16.8 12 22.5 11.6 16.8 10.4 13.1 1.5 12 10.4 10.9 11.6 7.2 12 1.5Z" fill="#FED170" stroke="#1A1714" stroke-width="1.4" stroke-linejoin="round"></path></g>
          </svg>
          <span style="position: absolute; left: 16px; right: 10px; bottom: 12px;">
            <span style="display: block; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 0.98; letter-spacing: -0.4px;">Receitas da vó Cida</span>
            <span style="display: block; margin-top: 5px; font-size: 10.5px; font-weight: 700; opacity: 0.8;">Aparecida Ramos</span>
          </span>
        </span>
        <button aria-label="Trocar a capa (foto, galeria ou capa automática)" style="position: absolute; right: -12px; top: -10px; z-index: 1; width: 40px; height: 40px; padding: 0; border-radius: 50%; background: #FFFAF1; border: 1.5px solid #1A1714; box-shadow: 2px 2px 0 #1A1714; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><path d="M14.6 11.2a3 3 0 0 0-5.3 1"></path><path d="M9.4 14.8a3 3 0 0 0 5.3-1"></path><path d="M14.8 9.6v1.8H13M9.2 16.4v-1.8H11"></path></svg></button>
        <span style="position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); height: 24px; padding: 0 9px; border-radius: 999px; background: #FED170; border: 1.3px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; font-size: 10.5px; font-weight: 800; white-space: nowrap;">capa automática</span>
      </div>
      <div style="min-width: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <button style="height: 48px; padding: 0 12px; border-radius: 16px; background: #FFFAF1; border: 1.5px solid #1A1714; box-shadow: 2px 2px 0 #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; white-space: nowrap;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Fotografar capa</button>
        <button style="height: 48px; padding: 0 12px; border-radius: 16px; background: #FFFAF1; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; white-space: nowrap;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m20 16-5-5-8 8"></path></svg>Da galeria</button>
        <span style="margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #6F665B;">OU ESCOLHA A COR</span>
        <div role="radiogroup" aria-label="Cor da capa automática" style="display: flex; gap: 8px; padding-left: 2px;"><button role="radio" aria-checked="true" aria-label="Capa #FFC1C6" style="width: 28px; height: 28px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #FFC1C6; border: 1.5px solid #1A1714; box-sizing: border-box; box-shadow: 0 0 0 2.5px #FFFAF1, 0 0 0 4px #1A1714;"></button><button role="radio" aria-checked="false" aria-label="Capa #FED170" style="width: 28px; height: 28px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #FED170; border: 1.5px solid #1A1714; box-sizing: border-box;"></button><button role="radio" aria-checked="false" aria-label="Capa #B6ACE4" style="width: 28px; height: 28px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #B6ACE4; border: 1.5px solid #1A1714; box-sizing: border-box;"></button><button role="radio" aria-checked="false" aria-label="Capa #ABCF82" style="width: 28px; height: 28px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #ABCF82; border: 1.5px solid #1A1714; box-sizing: border-box;"></button><button role="radio" aria-checked="false" aria-label="Capa #FF552E" style="width: 28px; height: 28px; flex-shrink: 0; padding: 0; border-radius: 50%; background: #FF552E; border: 1.5px solid #1A1714; box-sizing: border-box;"></button></div>
      </div>
    </div>

    <!-- form -->
    <div style="margin-top: 34px;">
      <label for="am-title" style="display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">Título</label>
      <div style="margin-top: 6px; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 10px;"><input id="am-title" type="text" value="Receitas da vó Cida" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; outline: none; padding: 0; font-size: 16px; font-weight: 600; color: #1A1714;"></div>

      <label for="am-author" style="margin-top: 14px; display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">Autor<span style="font-weight: 600; color: #8A8073;"> · opcional</span></label>
      <div style="margin-top: 6px; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 10px;"><input id="am-author" type="text" value="Aparecida Ramos" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; outline: none; padding: 0; font-size: 16px; font-weight: 600; color: #1A1714;"></div>

      <span style="margin-top: 14px; display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">Formato</span>
      <div role="radiogroup" aria-label="Formato" style="margin-top: 6px; height: 50px; padding: 3px; border-radius: 999px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px;"><button role="radio" aria-checked="true" style="padding: 0; border-radius: 999px; background: {{brand}}; border: 1.5px solid #1A1714; box-sizing: border-box; font-size: 14px; font-weight: 800; white-space: nowrap;">Papel</button><button role="radio" aria-checked="false" style="padding: 0; border-radius: 999px; background: transparent; border: 1.5px solid transparent; box-sizing: border-box; font-size: 14px; font-weight: 700; white-space: nowrap;">E-book</button></div>

      <label for="am-pages" style="margin-top: 14px; display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">Número de páginas<span style="font-weight: 600; color: #8A8073;"> · opcional</span></label>
      <div style="margin-top: 6px; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 150px;"><input id="am-pages" type="text" inputmode="numeric" placeholder="ex.: 120" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; outline: none; padding: 0; font-size: 16px; font-weight: 600; color: #1A1714;"></div>
      <p style="margin: 6px 0 0 2px; font-size: 12.5px; font-weight: 500; line-height: 16px; color: #6F665B;">Sem ele, o app conta só os minutos de leitura.</p>

      <label for="am-isbn" style="margin-top: 14px; display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">ISBN<span style="font-weight: 600; color: #8A8073;"> · opcional</span></label>
      <div style="margin-top: 6px; height: 52px; padding: 0 14px 0 16px; border-radius: 16px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding-right: 6px;"><input id="am-isbn" type="text" inputmode="numeric" placeholder="978-…" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; outline: none; padding: 0; font-size: 16px; font-weight: 600; color: #1A1714;"><a href="#" aria-label="Ler o ISBN com a câmera" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FED170; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><path d="M8 8v8M11 8v8M14 8v8M17 8v8"></path></svg></a></div>

      <span style="margin-top: 14px; display: block; font-size: 13.5px; font-weight: 800; line-height: 18px;">Salvar como</span>
      <div role="radiogroup" aria-label="Salvar como" style="margin-top: 6px; height: 50px; padding: 3px; border-radius: 999px; background: #F7F0E3; border: 1.5px solid #1A1714; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;"><button role="radio" aria-checked="false" style="padding: 0; border-radius: 999px; background: transparent; border: 1.5px solid transparent; box-sizing: border-box; font-size: 14px; font-weight: 700; white-space: nowrap;">Quero ler</button><button role="radio" aria-checked="true" style="padding: 0; border-radius: 999px; background: {{brand}}; border: 1.5px solid #1A1714; box-sizing: border-box; font-size: 14px; font-weight: 800; white-space: nowrap;">Lendo</button><button role="radio" aria-checked="false" style="padding: 0; border-radius: 999px; background: transparent; border: 1.5px solid transparent; box-sizing: border-box; font-size: 14px; font-weight: 700; white-space: nowrap;">Lido</button></div>
    </div>

    <button style="margin-top: 26px; width: 100%; height: 56px; border-radius: 999px; background: #1A1714; border: 1.5px solid #1A1714; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 800; color: #F7F0E3;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F0E3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="color: #F7F0E3;">Adicionar à estante</span></button>
    <p style="margin: 10px 8px 0; text-align: center; font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #6F665B;">Livros adicionados à mão ficam só com você. Dá para editar tudo depois.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#B6ACE4","options":["#B6ACE4","#FFC1C6","#ABCF82","#FED170"]},"$preview":{"width":390,"height":1150}}'>

    return { brand: this.props.brand ?? '#B6ACE4' };
