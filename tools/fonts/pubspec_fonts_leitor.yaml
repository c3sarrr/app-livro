# Bloco PROPOSTO para a G11 (design system do leitor) — NÃO está no pubspec.yaml ainda.
# GERADO a partir de tools/fonts/build_fonts.py (G01.7). Mesmas regras da v1: não usar google_fonts; não declarar
# pesos que não existem; Bricolage e Literata estáticas = 1 família por tamanho (opsz = tamanho);
# subconjuntos em famílias separadas (Ext, Vi, Cyr…) usadas como fontFamilyFallback, na ordem do unicode-range.
#
# 1) ACRESCENTAR às famílias existentes da v1 (Figtree 800 real nas telas 19–27b — D-16; a Início continua
#    pedindo w700 explicitamente para o CSS 800, D-14, então nada muda nela):
#    - family: Figtree     → + asset: assets/fonts/Figtree-ExtraBold.ttf     weight: 800
#    - family: FigtreeExt  → + asset: assets/fonts/FigtreeExt-ExtraBold.ttf  weight: 800
#    (CSS 900 da tela 23b renderiza 800: o @font-face do arquivo vai só até 800.)
#
# 2) FAMÍLIAS NOVAS:
  fonts:
