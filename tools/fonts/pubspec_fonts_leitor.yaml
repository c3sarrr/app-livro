    # Literata VARIÁVEL (opsz 7–72, wght 400–900): texto do livro em qualquer tamanho/peso (D-17, spike S1).
    # No Flutter: TextStyle(fontFamily: 'LiterataVF', fontVariations: [FontVariation('opsz', tamanho), FontVariation('wght', peso)]).
    - family: LiterataVF
      fonts:
        - asset: assets/fonts/Literata-VF.ttf
        - asset: assets/fonts/LiterataItalic-VF.ttf
          style: italic
    - family: LiterataVFExt
      fonts:
        - asset: assets/fonts/Literata-VFExt.ttf
        - asset: assets/fonts/LiterataItalic-VFExt.ttf
          style: italic
