<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Moderação — BookNest</title>
    <link rel="stylesheet" href="estilo.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>Moderação</h1>
      <p class="suave">Denúncias abertas, da mais antiga para a mais nova. A meta é responder em até 24 h.</p>

      <section id="etapa-email">
        <h2>Entrar</h2>
        <form id="form-email" novalidate>
          <label for="email">E-mail da sua conta</label>
          <input id="email" type="email" autocomplete="email" required placeholder="seu@email.com">
          <div class="acoes"><button class="principal" type="submit">Enviar código</button></div>
        </form>
      </section>

      <section id="etapa-codigo" hidden>
        <h2>Código</h2>
        <form id="form-codigo" novalidate>
          <label for="codigo">Código de 6 dígitos</label>
          <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
            placeholder="000000">
          <div class="acoes">
            <button class="principal" type="submit">Entrar</button>
            <button id="voltar" type="button">Trocar e-mail</button>
          </div>
        </form>
      </section>

      <section id="etapa-fila" hidden>
        <div class="topo">
          <h2 id="contagem">Fila</h2>
          <button id="atualizar" type="button">Atualizar</button>
        </div>
        <ol id="fila" class="fila"></ol>
        <p id="vazia" class="suave" hidden>Nenhuma denúncia aberta.</p>
      </section>

      <p id="aviso" class="aviso" role="status" aria-live="polite" hidden></p>
    </main>
    <template id="modelo-item">
      <li class="item">
        <div class="cabeca">
          <span class="tipo"></span>
          <span class="motivo"></span>
          <span class="idade"></span>
          <span class="atrasada" hidden>passou do prazo</span>
        </div>
        <blockquote class="texto"></blockquote>
        <label class="rotulo">Nota (opcional)<input class="nota" type="text" maxlength="1000"></label>
        <div class="acoes">
          <button class="perigo esconder" type="button">Esconder</button>
          <button class="manter" type="button">Manter</button>
        </div>
      </li>
    </template>
  </body>
</html>
